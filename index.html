<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holden Home Services — Plumbing, Electric, HVAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --copper:#E07B2E;--copper-dark:#C4651D;--copper-light:#F5A25D;--copper-soft:#FFF1E5;
  --navy:#1B365D;--navy-dark:#12294A;--navy-light:#2F5A94;
  --sky:#EAF3FC;--sky-2:#F4F8FD;--white:#FFFFFF;--charcoal:#212529;--muted:#55606D;
  --line:#E6EBF1;--cyan:#1AA7D9;
  --shadow-sm:0 2px 8px rgba(27,54,93,.06);--shadow-md:0 8px 24px rgba(27,54,93,.09);--shadow-lg:0 16px 40px rgba(27,54,93,.12);
  --radius:14px;--radius-lg:24px;--radius-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Montserrat,Segoe UI,Arial,sans-serif;background:var(--white);color:var(--charcoal);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img,svg{display:block;max-width:100%}
ul{list-style:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:var(--radius-pill);font-weight:700;font-size:15px;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn.copper{background:linear-gradient(135deg,var(--copper-light),var(--copper));color:#fff;box-shadow:0 6px 16px rgba(224,123,46,.35)}
.btn.navy{background:linear-gradient(135deg,var(--navy-light),var(--navy));color:#fff;box-shadow:0 6px 16px rgba(27,54,93,.25)}
.btn.outline{background:#fff;border:2px solid var(--copper);color:var(--copper-dark)}
.btn.outline:hover{background:var(--copper);color:#fff}
.btn.sm{padding:10px 18px;font-size:13.5px}

/* HEADER */
.site-header{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--shadow-sm)}
.topbar{height:4px;background:linear-gradient(90deg,var(--copper-light),var(--copper),var(--navy-light))}
.header-inner{max-width:1280px;margin:0 auto;padding:14px 24px 0}
.row1{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:14px}
.logo-group{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mark{height:110px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark img{height:100%;width:auto;max-width:100%;object-fit:contain}
.ctas{display:flex;gap:12px;flex-wrap:wrap}

nav{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 20px;padding:12px 0;border-top:1px solid var(--line);margin-top:8px}
.item{position:relative}
.link{font-weight:700;font-size:14px;letter-spacing:.4px;text-transform:uppercase;color:var(--navy);display:inline-flex;align-items:center;gap:6px;padding:8px 0}
.link:hover{color:var(--copper)}
.link.offers{color:var(--copper)}
.chev{width:10px;height:10px}
.menu{position:absolute;top:100%;left:0;min-width:210px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);border:1px solid var(--line);padding:8px 0;z-index:20}
.menu a{display:block;padding:10px 18px;font-size:14px;font-weight:600}
.menu a:hover{background:var(--copper-soft);color:var(--copper-dark)}
.burger{display:none;background:var(--navy);color:#fff;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:700}

/* BRAND BUTTONS (from brand sheet) */
.btn-book{display:inline-flex;align-items:center;gap:10px;padding:13px 24px;border-radius:var(--radius-pill);
  background:linear-gradient(180deg,#223f6b,#0f2547);color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 0 0 2px #b87a3d, 0 8px 20px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s}
.btn-book:hover{transform:translateY(-2px);box-shadow:0 0 0 2px #d18b48, 0 12px 26px rgba(0,0,0,.4)}
.btn-book svg{width:16px;height:16px}
.btn-call{display:inline-flex;align-items:center;gap:10px;padding:13px 26px;border-radius:var(--radius-pill);
  background:linear-gradient(180deg,var(--copper-light),var(--copper-dark));color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 8px 20px rgba(224,123,46,.4);transition:transform .15s,box-shadow .15s}
.btn-call:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(224,123,46,.5)}
.btn-call svg{width:16px;height:16px}

/* HERO */
.hero{background:linear-gradient(115deg,rgba(0,0,0,0.88) 0%,rgba(0,0,0,0.6) 55%,rgba(0,0,0,0.35) 100%),
  url('https://cdn.getyourguide.com/image/format=avif%2Cfit=cover%2Cgravity=auto%2Cquality=60/dam/iStock-2171251252-HEADERMOBILE.jpg') center/cover no-repeat;
  color:#fff;position:relative;min-height:620px;display:flex;align-items:center}
.hero-inner{max-width:1280px;margin:0 auto;position:relative;padding:64px 24px 96px;display:flex;justify-content:space-between;align-items:flex-start;gap:32px;flex-wrap:wrap;width:100%}
.hero-inner > div:first-child{flex:1;min-width:0}
.headline{display:flex;flex-direction:column;align-items:flex-start;line-height:1;font-weight:900;font-style:italic;letter-spacing:-.02em}
.headline span{display:block;white-space:nowrap}
.s-xl{font-size:clamp(56px,10vw,120px)}
.s-lg{font-size:clamp(48px,8.5vw,102px)}
.s-md{font-size:clamp(30px,5vw,58px)}
.copper-text{color:var(--copper);text-shadow:3px 3px 10px rgba(0,0,0,.7)}
.white-text{color:#fff;text-shadow:3px 3px 10px rgba(0,0,0,.7)}
.hero-ctas{display:flex;align-items:center;gap:14px;margin-top:36px;flex-wrap:wrap}
.or-chip{display:inline-flex;align-items:center;justify-content:center;min-width:52px;padding:10px 14px;
  background:rgba(30,20,15,.75);border:1px solid rgba(255,255,255,.18);border-radius:var(--radius-pill);
  color:#f2e4d6;font-weight:700;font-size:14px;font-style:italic}

/* Reviews badge — brand-sheet style */
.badge{width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f0b378 0%,#c97a34 55%,#8a4d17 100%);
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:3px solid rgba(255,255,255,.15);outline:3px solid rgba(184,122,61,.9);outline-offset:3px;
  flex-shrink:0;box-shadow:0 12px 32px rgba(224,123,46,.45),inset 0 -8px 18px rgba(0,0,0,.25);text-align:center;padding:8px}
.badge .stars{font-size:11px;letter-spacing:2px;line-height:1;margin-bottom:4px}
.badge b{font-size:30px;font-weight:900;line-height:1}
.badge i{font-size:12px;font-style:normal;font-weight:700;margin-top:2px}
.badge .stars.bottom{margin-top:5px;margin-bottom:0}

/* OFFER BANNER — brand-sheet dark horizontal banner */
.promo-wrap{max-width:1100px;margin:-56px auto 0;position:relative;padding:0 24px;z-index:5}
.offer-banner{border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#2a2f36 0%,#1a1e23 100%);box-shadow:0 22px 50px rgba(0,0,0,.35)}
.offer-main{display:flex;align-items:center;gap:20px;padding:22px 28px;flex-wrap:wrap}
.offer-get{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-style:italic;font-weight:900;line-height:1;flex-shrink:0;transform:rotate(-3deg)}
.offer-get b{font-size:16px}
.offer-get i{font-size:11px;font-style:italic;opacity:.9;font-weight:700}
.offer-amt{font-size:clamp(52px,7vw,84px);font-weight:900;line-height:.9;color:#fff;letter-spacing:-3px;flex-shrink:0;text-shadow:0 3px 10px rgba(0,0,0,.6)}
.offer-text{flex:1;min-width:200px;color:#fff}
.offer-text .t1{font-size:clamp(18px,2.4vw,26px);font-weight:900;line-height:1.15}
.offer-van{flex-shrink:0;width:150px}
.offer-van svg{width:100%;height:auto;color:#fff}
.offer-sub{background:linear-gradient(90deg,var(--copper-light),var(--copper-dark));color:#fff;padding:10px 28px;
  font-weight:700;font-size:14px;text-align:center}

/* SECTIONS */
section{padding:72px 24px}
.section-title{margin:0;font-size:clamp(26px,3.5vw,38px);font-weight:800;letter-spacing:-.5px;color:var(--navy);text-align:center}
.section-rule{width:70px;height:4px;background:var(--copper);border-radius:2px;margin:14px auto 48px}

/* SERVICES */
.services{background:var(--sky-2);max-width:none}
.services .section-title,.services .section-rule,.services .cards{max-width:1280px;margin-left:auto;margin-right:auto}
.services .section-rule{width:56px;height:5px;background:var(--copper);margin:12px auto 48px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
.card{background:#fff;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 8px 24px rgba(27,54,93,.08);transition:transform .25s,box-shadow .25s;border:1px solid #EEF3F8}
.card:hover{transform:translateY(-6px);box-shadow:0 16px 34px rgba(27,54,93,.14)}
.card-img{height:170px;background:#E9EEF4;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:26px 22px 28px;display:flex;flex-direction:column;flex:1;align-items:center;text-align:center}
.card-body h3{margin:0 0 12px;font-size:20px;font-weight:800;color:var(--navy);line-height:1.25}
.card-body p{margin:0 0 22px;color:var(--muted);line-height:1.7;font-size:14.5px;flex:1;max-width:250px}
.more{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:230px;padding:12px 22px;
  border:1.8px solid var(--cyan);border-radius:var(--radius-pill);color:var(--cyan);background:#fff;
  font-weight:700;font-size:14px;transition:all .18s;margin-top:auto}
.more svg{width:15px;height:15px}
.more:hover{background:var(--cyan);color:#fff}

/* DEALS */
.deals{background:#fff;max-width:1300px;margin:0 auto}
.deal-row{display:flex;justify-content:center;align-items:center;gap:22px;flex-wrap:wrap}
.deal{display:inline-flex;align-items:center;transition:transform .15s}
.deal:hover{transform:translateY(-3px)}
.deal-price{z-index:1;margin-right:-18px;min-width:58px;height:56px;padding:0 12px;border-radius:28px 28px 28px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:#fff;font-style:italic}
.deal-price small{font-size:9px;font-weight:700;text-transform:uppercase}
.deal-price b{font-size:20px;font-weight:900}
.deal-price.copper{background:linear-gradient(135deg,var(--copper-light),var(--copper))}
.deal-price.navy{background:linear-gradient(135deg,var(--navy-light),var(--navy))}
.deal-price.deep{background:var(--navy)}
.deal-label{background:var(--sky);border:1px solid #D3E4F6;padding:10px 16px 10px 30px;display:flex;flex-direction:column;
  text-align:left;line-height:1.15;min-width:150px;border-radius:0 var(--radius) var(--radius) 0}
.deal-label strong{font-size:14px;font-weight:900;text-transform:uppercase;color:var(--navy)}
.deal-label em{font-size:11px;font-style:normal;text-transform:uppercase;color:var(--copper-dark);margin-top:2px;font-weight:700}

/* FINANCING */
.financing{background:linear-gradient(135deg,var(--copper),var(--copper-light));color:#fff;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:20px;padding:64px 24px}
.fin-title{margin:0;font-size:clamp(26px,3.5vw,36px);font-weight:800}
.financing .btn.navy{background:#fff;color:var(--copper-dark)}

/* ABOUT */
.about{background:#fff}
.about-inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.about-title{margin:0;font-size:clamp(24px,3vw,34px);line-height:1.3;font-weight:800;color:var(--navy)}
.about-rule{width:60px;height:4px;background:var(--copper);margin:16px 0 24px;border-radius:2px}
.about-copy p{color:var(--muted);line-height:1.75;font-size:15px;margin:0 0 16px}
.about-copy a:not(.btn){color:var(--copper-dark);font-weight:600}
.about-photo{border-radius:var(--radius-lg);min-height:440px;display:grid;place-items:end center;padding-bottom:24px;
  background:linear-gradient(160deg,rgba(255,255,255,0),rgba(27,54,93,.35)),linear-gradient(135deg,var(--copper-light),var(--navy-light));
  color:#fff;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:13px;box-shadow:var(--shadow-lg)}

/* MEMBERSHIP */
.member{background:linear-gradient(180deg,var(--sky),var(--sky-2));padding:72px 24px 0;position:relative}
.member-card{max-width:1200px;margin:0 auto;background:#fff;border-radius:var(--radius-lg);padding:44px;
  display:grid;grid-template-columns:1.3fr 1fr;gap:36px;align-items:center;box-shadow:var(--shadow-lg);border-top:6px solid var(--copper)}
.member-logo{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.member-logo-img{height:52px;width:auto;object-fit:contain}
.m-kind{font-size:13px;letter-spacing:5px;color:var(--muted);text-transform:uppercase;font-weight:700}
.member-title{margin:0 0 14px;font-size:22px;line-height:1.45;font-weight:800;color:var(--navy)}
.member-copy p{margin:0;color:var(--muted);line-height:1.75;font-size:15px}
.member-booklet{height:300px;max-width:240px;margin:0 auto;border-radius:10px;transform:rotate(14deg);
  background:linear-gradient(160deg,var(--copper-light),var(--navy-light));box-shadow:8px 14px 26px rgba(27,54,93,.25);
  display:grid;place-items:center;color:#fff;font-weight:800;text-transform:uppercase;padding:20px;font-size:14px;letter-spacing:1px;text-align:center}
.member-wave{display:block;width:100%;height:120px;margin-top:-20px}

/* FEATURE */
.feature{background:#fff;padding:72px 24px}
.feature-plain{background:var(--sky-2);padding-top:56px}
.feature-inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1.1fr;gap:56px;align-items:center}
.feature-inner.reverse{grid-template-columns:1.1fr 1fr}
.feature-photo-wrap{position:relative;max-width:420px;margin:0 auto;width:100%}
.feature-backdrop{position:absolute;inset:-24px 32px 32px -56px;background:var(--copper-soft);border-radius:32px;transform:rotate(-7deg)}
.navy-back .feature-backdrop{background:#DCEBFA;inset:-32px -56px 32px 40px;transform:rotate(8deg)}
.feature-photo{position:relative;height:460px;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  background:linear-gradient(160deg,var(--navy-light),#6FA0D8);color:rgba(255,255,255,.95);
  display:grid;place-items:end center;padding-bottom:24px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-size:13px}
.feature-photo.drain-photo{background:linear-gradient(160deg,var(--copper-light),var(--navy-light))}
.feature-photo.electric-photo{background:linear-gradient(160deg,#FFC78F,var(--copper))}
.feature-photo.hvac-photo{background:linear-gradient(160deg,#6FA0D8,var(--copper-light))}
.feature-copy p{color:var(--muted);line-height:1.75;font-size:15px;margin:0}
.feature-copy a:not(.btn){color:var(--copper-dark);font-weight:600}
.feature-cta{margin-top:28px}

/* REVIEWS */
.reviews{background:linear-gradient(180deg,var(--sky),#F9FCFF);padding:72px 24px 56px;text-align:center}
.rev-title{margin:0;color:var(--navy);font-size:clamp(26px,3.5vw,36px);font-weight:800}
.rev-rule{width:70px;height:4px;background:var(--copper);margin:14px auto 48px;border-radius:2px}
.rev-cards{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.rev-card{background:#fff;border-radius:var(--radius-lg);padding:32px;text-align:left;min-height:260px;
  box-shadow:var(--shadow-md);border-left:5px solid var(--copper)}
.rev-card p{color:var(--charcoal);line-height:1.75;font-size:15px;margin:8px 0 20px;font-style:italic}
.rev-who{display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--copper-light),var(--navy-light));
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.stars-line{color:var(--copper);font-size:17px;letter-spacing:3px}
.rev-name{font-weight:800;font-size:15px;text-transform:uppercase;color:var(--navy)}
.dots{margin-top:28px;display:flex;gap:10px;justify-content:center}
.dots button{width:11px;height:11px;border-radius:50%;background:rgba(27,54,93,.20)}
.dots button.on{background:var(--copper);transform:scale(1.25)}

/* GUARANTEES */
.guarantees{padding:72px 24px 64px;text-align:center;background:#fff}
.g-van{height:100px;display:grid;place-items:center;margin-bottom:24px;color:var(--copper)}
.g-van svg{width:80px;height:80px}
.g-grid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:32px 28px}
.g-circle{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;
  background:var(--copper-soft);border:3px solid var(--copper);color:var(--copper)}
.g-circle svg{width:34px;height:34px}
.g-circle.navy{background:var(--sky);border-color:var(--navy-light);color:var(--navy)}
.g-label{font-weight:800;font-size:14px;color:var(--navy);line-height:1.4}

/* AREAS */
.areas{background:linear-gradient(180deg,#fff 0,#fff 140px,var(--sky) 140px,var(--sky-2) 100%);padding:72px 24px}
.same-day{max-width:620px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:28px 32px 28px 56px;border-radius:var(--radius-pill);color:#fff;
  background:linear-gradient(90deg,var(--copper),var(--copper-light));box-shadow:var(--shadow-lg)}
.same-day h2{margin:0 0 16px;font-size:19px;line-height:1.4;font-weight:800}
.sd-photo{width:160px;height:170px;margin-top:-52px;border-radius:20px;background:linear-gradient(160deg,var(--navy-light),var(--navy));
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px;
  font-weight:700;font-size:12px;text-align:center;flex-shrink:0}
.sd-photo small{font-size:10px;opacity:.9;margin-top:6px}
.areas-inner{max-width:1000px;margin:52px auto 0;display:grid;grid-template-columns:1.1fr 1fr;gap:40px;color:var(--navy)}
.areas-list h2{margin:0 0 18px;font-size:24px;font-weight:800;color:var(--navy)}
.areas-list ul{margin:0 0 22px;padding:0;columns:3;column-gap:18px;font-size:13px;line-height:2}
.areas-list li::before{content:"▸ ";color:var(--copper);font-weight:800}
.areas-map{min-height:320px;background:#fff;border:2px dashed rgba(224,123,46,.55);border-radius:var(--radius);
  display:grid;place-items:center;color:var(--muted);font-weight:700;letter-spacing:3px;text-transform:uppercase;font-size:13px}

/* SCHEDULE */
.schedule{background:linear-gradient(135deg,#FFF4EA,var(--sky));padding:80px 24px;text-align:center;color:var(--navy);border-top:6px solid var(--copper)}
.schedule h2{margin:0 0 32px;font-size:clamp(26px,4vw,42px);line-height:1.15;font-weight:900}
.hero-ctas.center{justify-content:center;margin-top:0;color:var(--navy)}
.hero-ctas.center .or-chip{background:#2a2f36;color:#f2e4d6}

/* FOOTER */
.footer{background:var(--sky-2);color:var(--navy);padding:32px 24px 24px;border-top:1px solid var(--line)}
.f-van{text-align:center;margin-bottom:16px;color:var(--copper)}
.f-van svg{width:70px;height:70px;margin:0 auto}
.f-inner{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:40px}
.f-col h3{margin:0 0 16px;font-size:16px;font-weight:800;color:var(--copper-dark);text-transform:uppercase}
.f-line{margin:0 0 10px;font-size:13px;display:flex;gap:8px;align-items:flex-start;color:var(--charcoal)}
.f-line svg{width:16px;height:16px;flex:none;color:var(--copper);margin-top:2px}
.f-map{width:100%;max-width:200px;height:100px;background:#fff;border:1px dashed rgba(224,123,46,.55);border-radius:8px;
  display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:16px}
.f-center{text-align:center;display:flex;flex-direction:column;align-items:center;padding-top:32px}

function NavItems({ items }) {
  const [openIndex, setOpenIndex] = React.useState(null);
  const handleToggle = (e, idx) => { e.stopPropagation(); setOpenIndex(openIndex === idx ? null : idx); };
  React.useEffect(() => {
    const closeAll = () => setOpenIndex(null);
    document.addEventListener('click', closeAll);
    return () => document.removeEventListener('click', closeAll);
  }, []);
  return items.map((item, idx) => {
    if (!item.children) {
      const cls = 'link' + (item.highlight ? ' offers' : '');
      return <div className="item" key={idx}><a className={cls} href={item.href || '#'}>{item.label}</a></div>;
    }
    const childLinks = item.children.map((c, ci) => <a key={ci} href={'#' + c.toLowerCase().replace(/\W+/g, '-')}>{c}</a>);
    const isOpen = openIndex === idx;
    return (
      <div className="item" key={idx}>
        <button className="link" type="button" onClick={(e) => handleToggle(e, idx)}>{item.label} {ICONS.chevron}</button>
        <div className="menu" hidden={!isOpen}>{childLinks}</div>
      </div>
    );
  });
}

  const visible = [reviews[idx % reviews.length], reviews[(idx + 1) % reviews.length]];
  return (
    <section className="reviews" id="reviews">

          <ul>{shown.map((a, i) => <li key={i}>{a}</li>)}</ul>
          {areas.length > 15 && (
            <button className="btn copper sm" type="button" onClick={() => setShowAll(!showAll)}>
              {showAll ? 'Show Fewer Areas' : 'Load More Areas'} {ICONS.arrow}
            </button>
          )}
        </div>
        <div className="areas-map"><span>Map</span></div>
      </div>
    </section>
  );
}

function Schedule({ C }) {
  const tel = String(C.phone || '').replace(/\D/g, '');
  return (
    <section className="schedule">
      <h2>Schedule an Appointment Today!</h2>
      <div className="hero-ctas center">
        <a className="btn-book" href={C.bookUrl || '#'}>Book Online {ICONS.arrow}</a>
        <span className="or-chip">Or</span>
        <a className="btn-call" href={`tel:${tel}`}>Call Now {ICONS.arrow}</a>
      </div>
    </section>
  );
}

function Footer({ C, areas }) {
  const tel = String(C.phone || '').replace(/\D/g, '');
  const footerAreas = areas.slice(0, 24);
  return (
    <footer className="footer">
      <div className="f-van">{ICONS.van}</div>
      <div className="f-inner">
        <div className="f-col">
          <h3>Connect With Us</h3>
          <p className="f-line">{ICONS.pin} {C.address}</p>
          <p className="f-line">{ICONS.mail} {C.email}</p>
          <div className="f-map"><span>Map</span></div>
        </div>
        <div className="f-col f-center">
          <a className="f-call" href={`tel:${tel}`}>
            <span className="f-ico">{ICONS.phone}</span>
            <span><small>Call us for same-day service</small><b>{C.phone}</b></span>
          </a>
          <div className="f-social">
            <a href="#" aria-label="LinkedIn">in</a>
            <a href="#" aria-label="Instagram">ig</a>
            <a href="#" aria-label="Facebook">f</a>
            <a href="#" aria-label="X">X</a>
          </div>
          <p className="f-lic">{C.license}</p>
        </div>
        <div className="f-col">
          <h3>Service Areas</h3>
          <ul className="f-areas">{footerAreas.map((a, i) => <li key={i}>{a}</li>)}</ul>
        </div>
      </div>
      <p className="f-copy">Copyright © {new Date().getFullYear()} {C.brand}. All Rights Reserved</p>
    </footer>
  );
}

function App() {
  const C = content.config;
  const H = content.hero;
  const tel = String(C.phone || '').replace(/\D/g, '');
  const [navOpen, setNavOpen] = React.useState(false);

  return (
    <>
      <div className="site-header">
        <div className="topbar"></div>
        <div className="header-inner">
          <div className="row1">
            <div className="brand"><LogoGroup C={C} /></div>
            <div className="ctas">
              <a className="btn-book" href={C.bookUrl || '#'}>Book Online {ICONS.arrow}</a>
              <a className="btn-call" href={`tel:${tel}`}>Call Now {ICONS.arrow}</a>
            </div>
            <button className="burger" type="button" onClick={() => setNavOpen(!navOpen)}>☰ Menu</button>
          </div>
          <nav className={navOpen ? 'show' : ''}><NavItems items={C.nav} /></nav>
        </div>
      </div>

      <section className="hero">
        <div className="hero-inner">
          <div>
            <h1 className="headline">
              {H.lines.map((l, i) => <span key={i} className={l.cls}>{l.text}</span>)}
            </h1>
            <div className="hero-ctas">
              <a className="btn-book" href={C.bookUrl || '#'}>Book Online {ICONS.arrow}</a>
              <span className="or-chip">Or</span>
              <a className="btn-call" href={`tel:${tel}`}>Call Now {ICONS.arrow}</a>
            </div>
          </div>
          <div className="badge">
            <span className="stars">★ ★ ★ ★ ★</span>
            <b>{H.reviewCount}</b>
            <i>Reviews</i>
            <span className="stars bottom">★ ★ ★ ★ ★</span>
          </div>
        </div>
      </section>

      <div className="promo-wrap">
        <div className="offer-banner">
          <div className="offer-main">
            <div className="offer-get"><b>Get</b><i>up to</i></div>
            <div className="offer-amt">${H.promoAmount}</div>
            <div className="offer-text"><div className="t1">{H.promoTitle}</div></div>
            <div className="offer-van">{VanIllustration}</div>
          </div>
          <div className="offer-sub">{H.promoSub}</div>
        </div>
      </div>

      <Services list={content.services} />
      <Deals list={content.deals} />
      <Financing />
      <About about={content.about} />
      <Membership membership={content.membership} />
      <Features features={content.features} />
      <Reviews reviews={content.reviews} />
      <Guarantees list={content.guarantees} />
      <Areas areas={content.areas} about={content.about} C={C} />
      <Schedule C={C} />
      <Footer C={C} areas={content.areas} />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
